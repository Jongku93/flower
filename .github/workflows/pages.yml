# main 에 올리면: 단위 시험 → 빌드 → gh-pages 가지에 결과물 올림 → https://jongku93.github.io/flower/
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 함께 보는 순위 서버 주소(저장소 Settings → Variables 의 LEADERBOARD_URL). 비어 있으면 이 기기 기록만
          VITE_LEADERBOARD_URL: ${{ vars.LEADERBOARD_URL }}
      - name: gh-pages 가지에 올리기
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "배포: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
